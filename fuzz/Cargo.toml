[package]
name = "aasb-corpus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
aasb-corpus = { path = ".." }
libfuzzer-sys = "0.4.13"
serde_json = "1.0.154"

[lints.rust]
unsafe_code = "forbid"

# A separate workspace, so the crate's own build, tests and coverage never compile the fuzzer.
[workspace]
members = ["."]

[[bin]]
name = "pages_line"
path = "fuzz_targets/pages_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_line"
path = "fuzz_targets/mcp_line.rs"
test = false
doc = false
bench = false
