[package]
name = "aasb-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
ref_option = "warn"
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
