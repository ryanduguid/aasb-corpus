name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces that pull request's older run.
  # Every other run is keyed on its commit, so a later merge cannot cancel
  # an earlier commit's run on main.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and its clippy, rustfmt and llvm-tools components.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install coverage and audit tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-audit@0.22.2,cargo-deny@0.22.0
          fallback: none

      - name: Install coverage tool (Windows)
        if: matrix.os == 'windows-latest'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the crate and its tests
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests with 100% line coverage
        run: |
          cargo llvm-cov --locked --lcov --output-path coverage-rust-${{ runner.os }}.lcov
          # Windows MSVC subprocess std::process::exit(1) drops profraw flushes for CLI error-exit lines; Linux enforces 0 uncovered lines.
          if [ "${{ runner.os }}" = "Linux" ] && grep -E '^DA:[0-9]+,0$' coverage-rust-${{ runner.os }}.lcov; then
            echo "::error::Uncovered Rust lines remain"
            exit 1
          fi

      - name: Use repository-relative coverage paths
        shell: pwsh
        run: |
          $report = "coverage-rust-$env:RUNNER_OS.lcov"
          $prefix = $env:GITHUB_WORKSPACE.Replace([IO.Path]::DirectorySeparatorChar, '/').TrimEnd('/') + '/'
          $lines = Get-Content -LiteralPath $report | ForEach-Object {
            if ($_.StartsWith('SF:')) {
              $path = $_.Substring(3).Replace([IO.Path]::DirectorySeparatorChar, '/')
              if (-not $path.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw 'Coverage source is outside the repository'
              }
              'SF:' + $path.Substring($prefix.Length)
            } else { $_ }
          }
          $lines | Set-Content -LiteralPath $report -Encoding utf8

      - name: Keep the Rust coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust-${{ runner.os }}
          path: coverage-rust-${{ runner.os }}.lcov
          retention-days: 1

      - name: Audit Cargo.lock against RustSec
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit --deny unsound --deny yanked

      - name: Check crate licences and sources
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --locked check licenses sources

      - name: Build the release binary
        if: github.event_name != 'pull_request'
        run: cargo build --locked --release

  python:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        run: >-
          python -m pip install --only-binary :all: pypdf coverage

      - name: Run Python unit tests with 100% coverage
        run: |
          python -X utf8 -m coverage run --branch --source=tools -m unittest discover -s tools -p 'test_*.py'
          python -X utf8 -m coverage report --fail-under=100 -m
          python -X utf8 -m coverage xml -o coverage-python.xml

      - name: Keep the Python coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage-python.xml
          retention-days: 1

  codecov:
    name: upload coverage to Codecov
    needs: [rust, python]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-rust-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust-Linux.lcov,coverage-rust-Windows.lcov,coverage-python.xml
          disable_search: true
          fail_ci_if_error: true
